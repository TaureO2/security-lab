name: Validar esquema

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar jsonschema
        run: pip install "jsonschema>=4.18"
      - name: Validar ejemplos
        run: python3 schema/validate.py
